
name: MeriZindagi Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'MeriZindagi-v3.7.1-Line834-Fixed.zip'
      - 'MeriZindagi-Reference-UI-Redesign-Pass1.zip'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and Build Android App
        run: |
          if [ -f "MeriZindagi-Reference-UI-Redesign-Pass1.zip" ]; then
            ZIP_FILE="MeriZindagi-Reference-UI-Redesign-Pass1.zip"
          elif [ -f "MeriZindagi-v3.7.1-Line834-Fixed.zip" ]; then
            ZIP_FILE="MeriZindagi-v3.7.1-Line834-Fixed.zip"
          else
            echo "Android source ZIP not found"
            exit 1
          fi

          echo "Building from: $ZIP_FILE"
          mkdir -p android-src
          unzip -q "$ZIP_FILE" -d android-src

          SETTINGS_FILE=$(find android-src -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle project not found in ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          test -f "$PROJECT_DIR/app/build.gradle.kts" || test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/java/com/merizindagi/app/MainActivity.kt"

          gradle -p "$PROJECT_DIR" assembleDebug

          APK_FILE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_FILE"
          echo "APK_PATH=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeriZindagi-Redesign-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          
