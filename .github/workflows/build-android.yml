name: Build MeriZindagi Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MeriZindagi-Android-Source.zip'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q MeriZindagi-Android-Source.zip -d android-src

      - name: Build APK
        working-directory: android-src/MeriZindagiAndroid
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MeriZindagi-APK
          path: android-src/MeriZindagiAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
