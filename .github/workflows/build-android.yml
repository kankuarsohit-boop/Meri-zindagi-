name: MeriZindagi Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'MeriZindagi-v3.7.1-BlueGold-SyntaxFix.zip'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v3.7.1 source
        run: |
          unzip -q MeriZindagi-v3.7.1-BlueGold-SyntaxFix.zip -d android-src

      - name: Verify Android project
        run: |
          find android-src -name build.gradle -o -name build.gradle.kts

      - name: Build Debug APK
        working-directory: android-src/MeriZindagi-Premium-Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeriZindagi-v3.7.1-APK
          path: android-src/**/*.apk
          if-no-files-found: error
          
